name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pipenv"
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pipenv
          pipenv install --dev

      - name: Run linting
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pipenv"
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pipenv
          pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXPLICIT_REPO: ${{ vars.BACKEND_ECR_REPOSITORY }}
        run: |
          if [ -n "$EXPLICIT_REPO" ]; then
            echo "image_uri=${EXPLICIT_REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "repo_url=${EXPLICIT_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "image_uri=${ECR_REGISTRY}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "repo_url=${ECR_REGISTRY}/backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Docker Image
        run: |
          cd starter/backend
          docker build \
            --tag "${{ steps.image.outputs.image_uri }}" \
            --tag "${{ steps.image.outputs.repo_url }}:latest" .
          docker push "${{ steps.image.outputs.image_uri }}"
          docker push "${{ steps.image.outputs.repo_url }}:latest"

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'cluster' }}
      IMAGE_URI: ${{ needs.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_DEFAULT_REGION }}"

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to Kubernetes Cluster
        run: |
          cd starter/backend/k8s
          kustomize edit set image backend="${{ env.IMAGE_URI }}"
          kustomize build | kubectl apply -f -
