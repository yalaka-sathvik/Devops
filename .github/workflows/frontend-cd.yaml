name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    env:
      REACT_APP_MOVIE_API_URL: ${{ vars.BACKEND_API_URL }}
      ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a reachable backend URL
        run: |
          if [[ -z "$REACT_APP_MOVIE_API_URL" ]]; then
            echo "::error::Set the BACKEND_API_URL repository variable to the backend LoadBalancer URL."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image URI
        id: image
        run: echo "image_uri=${ECR_REPOSITORY}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        run: |
          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL" \
            --tag "${{ steps.image.outputs.image_uri }}" \
            ./starter/frontend
          docker push "${{ steps.image.outputs.image_uri }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE_URI: ${{ needs.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Deploy image
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image "frontend=$IMAGE_URI"
          kustomize build | kubectl apply -f -